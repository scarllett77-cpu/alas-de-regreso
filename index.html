<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/icons/plane" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alas de Regreso RD | Sede Central</title>
    
    <!-- Motor de diseño Tailwind: El estuco digital de nuestra obra -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* Cimientos visuales: Fondo profundo y scroll fluido */
      body {
        margin: 0;
        padding: 0;
        background-color: #020408; /* El negro abisal de la tecnología */
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      /* Animación sutil para la carga del cristal */
      .glass-load {
        animation: fadeIn 1.5s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- 🏛️ El anclaje estructural: Donde la IA proyecta el Corazón de la Plataforma -->
    <div id="root" class="glass-load"></div>
    
    <!-- 
      ⚠️ EL PUENTE CRÍTICO: 
      Esta ruta debe coincidir exactamente con el nombre de tu archivo en /src.
      He configurado 'AppAlas.jsx' según tu preferencia de mando.
    -->
    <script type="module" src="/src/AppAlas.jsx"></script>
  </body>
</html>
